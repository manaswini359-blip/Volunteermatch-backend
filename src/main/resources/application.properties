server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/volunteermatch_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351
jwt.expiration=86400000

# AI Configuration
ai.provider=${AI_PROVIDER:mock}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-1.5-flash}

# Logging
logging.level.com.volunteermatch=INFO
logging.level.org.springframework.security=WARN
